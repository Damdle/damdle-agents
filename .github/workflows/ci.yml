name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Scan tracked files for common credential patterns
        run: npm run check:publication
      - name: Compile
        run: npm run build
      - name: Check local runner command
        run: npm run agent -- --help
      - name: Run local demo
        run: npm run demo
      - name: Run generic MCP demo
        run: npm run demo:mcp
